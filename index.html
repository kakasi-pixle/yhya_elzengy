<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Space Game</title>
<style>
body{margin:0;overflow:hidden;background:#001022;font-family:Arial}
canvas{display:block}
#levelText{
position:fixed;top:20px;left:20px;
color:white;font-size:22px;z-index:10
}
#bossHp{
position:fixed;top:20px;left:50%;
transform:translateX(-50%);
width:300px;height:20px;
border:2px solid white;display:none
}
#bossHpInner{height:100%;background:red;width:100%}
</style>
</head>
<body>

<div id="levelText">مرحلة 1</div>
<div id="bossHp"><div id="bossHpInner"></div></div>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")
canvas.width=innerWidth
canvas.height=innerHeight

const imgEnemy=new Image();imgEnemy.src="zen1.png"
const imgBoss=new Image();imgBoss.src="zen3.png"

let level=1
const levels=[
 {enemyShoot:false,enemyRate:0,bossType:1},
 {enemyShoot:true,enemyRate:2000,bossType:2},
 {enemyShoot:true,enemyRate:800,bossType:3}
]

const player={x:canvas.width/2,y:canvas.height-120,size:30}
let enemies=[],enemyLasers=[]
let lasers=[]
let boss=null,bossLasers=[],bossDir=1
let spawned=0,killed=0
let stage="enemies"

let keys={}
onkeydown=e=>keys[e.key]=true
onkeyup=e=>keys[e.key]=false

setInterval(()=>{
lasers.push({x:player.x,y:player.y})
},300)

setInterval(()=>{
if(stage==="enemies"){
 enemies.push({x:Math.random()*(canvas.width-80)+40,y:-60})
}
},900)

setInterval(()=>{
if(stage==="enemies"&&levels[level-1].enemyShoot){
 enemies.forEach(e=>{
  enemyLasers.push({x:e.x,y:e.y})
 })
}
},levels[level-1].enemyRate||999999)

function spawnBoss(){
 boss={
  x:canvas.width/2,y:120,hp:100+level*50
 }
 document.getElementById("bossHp").style.display="block"
}

setInterval(()=>{
if(stage==="boss"&&boss){
 if(level===1){
  bossLasers.push({x:boss.x,y:boss.y})
 }
 if(level===2){
  bossLasers.push({x:boss.x-30,y:boss.y})
  bossLasers.push({x:boss.x,y:boss.y})
  bossLasers.push({x:boss.x+30,y:boss.y})
 }
 if(level===3){
  bossLasers.push({x:boss.x-30,y:boss.y})
  bossLasers.push({x:boss.x,y:boss.y})
  bossLasers.push({x:boss.x+30,y:boss.y})
  enemies.push({x:Math.random()*canvas.width,y:-60})
 }
}
},900)

function update(){
document.getElementById("levelText").innerText="مرحلة "+level

if(keys["ArrowLeft"])player.x-=7
if(keys["ArrowRight"])player.x+=7
if(keys["ArrowUp"])player.y-=7
if(keys["ArrowDown"])player.y+=7

player.x=Math.max(30,Math.min(canvas.width-30,player.x))
player.y=Math.max(30,Math.min(canvas.height-30,player.y))

lasers.forEach(l=>l.y-=15)
enemyLasers.forEach(l=>l.y+=6)
bossLasers.forEach(l=>l.y+=8)

enemies.forEach(e=>{
 e.y+=2+level
 if(e.y>canvas.height)e.y=-60
 lasers.forEach(l=>{
  if(Math.abs(l.x-e.x)<35&&Math.abs(l.y-e.y)<35){
   e.y=-999;killed++
  }
 })
})

if(stage==="enemies"&&killed>=10+level*5){
 stage="boss"
 enemies=[]
 spawnBoss()
}

if(stage==="boss"){
 boss.x+=bossDir*3
 if(boss.x<80||boss.x>canvas.width-80)bossDir*=-1

 lasers.forEach(l=>{
  if(Math.abs(l.x-boss.x)<70&&Math.abs(l.y-boss.y)<70){
   boss.hp--
  }
 })

 document.getElementById("bossHpInner").style.width=boss.hp+"%"

 if(boss.hp<=0){
  level++
  document.getElementById("bossHp").style.display="none"
  boss=null
  bossLasers=[]
  enemies=[]
  enemyLasers=[]
  lasers=[]
  killed=0
  if(level>3){
   alert("لقد فزت")
  }else{
   stage="enemies"
  }
 }
}

bossLasers.forEach(l=>{
 if(Math.abs(l.x-player.x)<25&&Math.abs(l.y-player.y)<25){
  alert("لقد خسرت")
  location.reload()
 }
})
enemyLasers.forEach(l=>{
 if(Math.abs(l.x-player.x)<25&&Math.abs(l.y-player.y)<25){
  alert("لقد خسرت")
  location.reload()
 }
})
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="#00e6ff"
ctx.beginPath()
ctx.moveTo(player.x,player.y-30)
ctx.lineTo(player.x+20,player.y+25)
ctx.lineTo(player.x-20,player.y+25)
ctx.fill()

lasers.forEach(l=>{
 ctx.strokeStyle="#00ffff"
 ctx.lineWidth=5
 ctx.beginPath()
 ctx.moveTo(l.x,l.y)
 ctx.lineTo(l.x,l.y-40)
 ctx.stroke()
})

enemyLasers.forEach(l=>{
 ctx.strokeStyle="orange"
 ctx.lineWidth=4
 ctx.beginPath()
 ctx.moveTo(l.x,l.y)
 ctx.lineTo(l.x,l.y+40)
 ctx.stroke()
})

bossLasers.forEach(l=>{
 ctx.strokeStyle="red"
 ctx.lineWidth=6
 ctx.beginPath()
 ctx.moveTo(l.x,l.y)
 ctx.lineTo(l.x,l.y+50)
 ctx.stroke()
})

enemies.forEach(e=>{
 ctx.drawImage(imgEnemy,e.x-35,e.y-35,70,70)
})

if(stage==="boss"&&boss){
 ctx.drawImage(imgBoss,boss.x-80,boss.y-80,160,160)
}
}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}
loop()
</script>
</body>
</html>
